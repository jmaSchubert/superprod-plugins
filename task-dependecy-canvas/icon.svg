<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect x="4" y="4" width="40" height="40" rx="8" fill="url(#grad)" filter="url(#shadow)" />

  <!-- Connecting curves -->
  <path d="M 16 16 C 24 16, 24 32, 32 32" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="0" />
  <path d="M 16 16 C 24 16, 24 20, 32 20" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />

  <!-- Node 1 (Root/Prerequisite) -->
  <circle cx="16" cy="16" r="4.5" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" />

  <!-- Node 2 (Dependent 1) -->
  <circle cx="32" cy="20" r="4" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.5" />

  <!-- Node 3 (Dependent 2) -->
  <circle cx="32" cy="32" r="4" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.5" />

  <!-- Direction arrow on lower curve -->
  <polygon points="30,30 33,32 30,34" fill="#ffffff" />
</svg>
